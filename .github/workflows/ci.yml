name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubunut_latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with: 
          node-versions: 22
          cache: npm
    
      - name: Install dependecies
        run: npm ci

      - name: type check
        run: npm run check

      - name: run tests
        run: npm run test:run
    
      - name: build project
        run: npm run build